include /etc/nginx/crm/default-http.conf;

server {
  listen 80;
  listen [::]:80;
  server_name ${CRM_DOMAIN} ${CRM_REDIRECT_DOMAINS};
  server_tokens off;
  include /etc/nginx/crm/health-acme.conf;

  # Before the first certificate, expose only health and ACME validation.
  location / {
    default_type text/plain;
    return 503 "HTTPS certificate setup is in progress.\n";
  }
}
