server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  location = /health {
    # The container healthcheck uses the loopback address as its Host.
    if ($host != 127.0.0.1) { return 404; }
    default_type text/plain;
    return 200 "ok\n";
  }
  location / { return 404; }
}
