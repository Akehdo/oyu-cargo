# Empty keys bypass counters for preflight and health probes.
map "$request_method:$uri" $crm_api_key {
  default $binary_remote_addr;
  ~^OPTIONS: "";
  ~^(GET|HEAD):/(api/)?health/?$ "";
}
map "$request_method:$uri" $crm_login_key {
  default "";
  ~^POST:/(api/)?(client/)?auth/(login|register|telegram)/?$ $binary_remote_addr;
}
map "$request_method:$uri" $crm_refresh_key {
  default "";
  ~^POST:/(api/)?(client/)?auth/refresh/?$ $binary_remote_addr;
}
limit_req_zone $crm_api_key zone=crm_api:10m rate=10r/s;
limit_req_zone $crm_login_key zone=crm_login:10m rate=10r/m;
limit_req_zone $crm_refresh_key zone=crm_refresh:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;
