# Client cabinet: own origin plus embedded YouTube instruction videos.
# frame-ancestors lets Telegram Web open the cabinet as a Mini App (mobile and
# desktop Telegram use a webview); it also overrides X-Frame-Options there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org" always;
