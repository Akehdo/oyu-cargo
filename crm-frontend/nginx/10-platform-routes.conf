# App routes of the OYU Cargo platform (http context). Keep in sync with
# crm-client/src/layouts/AppLayout.tsx (TABS, /login, /register) and
# crm-frontend/src/app/modules.ts. Other paths return 404.
map $uri $oyu_portal_route {
  default 0;
  "/" 1;
  ~^/(login|register|address|tracks|instructions|profile)/?$ 1;
}
map $uri $oyu_admin_route {
  default 0;
  ~^/admin/?$ 1;
  ~^/admin/(operations|records|clients|expenses|cash|reports|search)/?$ 1;
}
