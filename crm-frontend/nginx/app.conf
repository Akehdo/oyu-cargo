root /usr/share/nginx/html;
index index.html;
client_max_body_size 64k;
gzip on;
gzip_types application/javascript application/json image/svg+xml text/css text/plain;

location /api/ {
  include /etc/nginx/crm/security-headers.conf;
  add_header Cache-Control "no-store" always;
  limit_req zone=crm_api burst=60 nodelay;
  limit_req zone=crm_login burst=4 nodelay;
  limit_req zone=crm_refresh burst=10 nodelay;
  error_page 429 = @crm_rate_limited;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream app:8080;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Public edge: never trust client-supplied forwarding headers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}
location @crm_rate_limited {
  include /etc/nginx/crm/security-headers.conf;
  default_type application/json;
  add_header Retry-After 6 always;
  add_header Cache-Control "no-store" always;
  return 429 '{"statusCode":429,"message":"Слишком много запросов. Повторите через несколько секунд."}';
}
# ---- OYU Cargo platform: client cabinet at /, admin panel at /admin ----
# Known app routes get the SPA; anything else is a real 404 with the
# platform 404 page (a copy of the cabinet index.html, which renders it).
error_page 404 /404.html;
location = /404.html {
  internal;
  include /etc/nginx/crm/security-headers.conf;
  include /etc/nginx/crm/csp-portal.conf;
  add_header Cache-Control "no-cache";
}

# Old address of the client cabinet.
location ^~ /client {
  return 301 /;
}

location /admin/assets/ {
  include /etc/nginx/crm/security-headers.conf;
  include /etc/nginx/crm/csp-crm.conf;
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
}
location /admin {
  include /etc/nginx/crm/security-headers.conf;
  include /etc/nginx/crm/csp-crm.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-cache";
  if ($oyu_admin_route) {
    rewrite ^ /admin/index.html break;
  }
  try_files $uri =404;
}

location /assets/ {
  include /etc/nginx/crm/security-headers.conf;
  include /etc/nginx/crm/csp-portal.conf;
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
}
location = /sw.js {
  include /etc/nginx/crm/security-headers.conf;
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}
location / {
  include /etc/nginx/crm/security-headers.conf;
  include /etc/nginx/crm/csp-portal.conf;
  add_header Cache-Control "no-cache";
  if ($oyu_portal_route) {
    rewrite ^ /index.html break;
  }
  try_files $uri =404;
}
